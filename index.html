<style>
:root {
  --bg:#060917; --panel:rgba(8,14,40,.88); --bord:rgba(0,229,255,.22);
  --cyan:#00e5ff; --gold:#ffd600; --red:#ff4060; --fg:#dce8ff; --dim:#6880a8;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Nunito',sans-serif;}

canvas    {position:fixed;inset:0;display:block;z-index:1;pointer-events:none;}
#game-area{position:fixed;inset:0;z-index:10;cursor:none;display:none;touch-action:none;}

#hud{position:fixed;top:0;left:12px;right:12px;z-index:20;display:flex;
  align-items:center;justify-content:space-between;padding:10px 0;pointer-events:none;}
#score-disp{font-family:'Orbitron',monospace;font-size:clamp(16px,5vw,22px);font-weight:900;
  color:var(--gold);letter-spacing:.06em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 18px rgba(255,214,0,.5);}
#level-disp{font-family:'Orbitron',monospace;font-size:clamp(10px,2.5vw,12px);font-weight:700;
  color:var(--dim);letter-spacing:.12em;}
#lives-disp{display:flex;gap:6px;align-items:center;}
.life{width:clamp(9px,2.5vw,12px);height:clamp(9px,2.5vw,12px);border-radius:50%;
  background:var(--red);box-shadow:0 0 10px var(--red);}
.life.dead{background:rgba(255,64,96,.15);box-shadow:none;}

#tgt-panel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:20;background:rgba(6,10,30,.95);border:1.5px solid rgba(0,229,255,.45);
  border-radius:16px;padding:12px 34px 15px;text-align:center;pointer-events:none;
  min-width:200px;max-width:calc(100vw - 40px);
  box-shadow:0 0 30px rgba(0,229,255,.12),inset 0 0 30px rgba(0,0,0,.4);}
#tgt-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(180,210,255,.75);margin-bottom:5px;}
#tgt-value{font-size:28px;font-weight:800;color:var(--cyan);line-height:1.25;
  text-shadow:0 0 22px rgba(0,229,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#combo-flash{position:fixed;top:68px;left:50%;transform:translateX(-50%);
  z-index:30;font-family:'Orbitron',monospace;font-size:20px;font-weight:900;
  color:var(--gold);text-shadow:0 0 20px rgba(255,214,0,.8);
  pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;}

/* ── Screens ── */
.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(4,7,20,.92);padding:20px;overflow-y:auto;}

.screen-title{font-family:'Orbitron',monospace;font-size:clamp(22px,6vw,48px);
  font-weight:900;letter-spacing:.04em;line-height:1.1;margin-bottom:10px;}
.screen-sub{font-size:clamp(13px,3.5vw,15px);color:var(--dim);line-height:1.7;
  max-width:380px;margin-bottom:20px;}
.screen-sub strong{color:var(--fg);}

/* Language picker */
#lang-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
.lang-btn{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  padding:8px 18px;border-radius:20px;border:1.5px solid rgba(0,229,255,.2);
  background:transparent;color:var(--dim);cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;min-height:40px;}
.lang-btn.active{border-color:var(--cyan);color:var(--fg);background:rgba(0,229,255,.1);
  box-shadow:0 0 14px rgba(0,229,255,.2);}
.lang-btn:hover{border-color:rgba(0,229,255,.4);color:var(--fg);}

.btn{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;
  letter-spacing:.1em;color:#060917;background:var(--cyan);border:none;
  border-radius:10px;padding:14px 46px;cursor:pointer;min-height:48px;
  box-shadow:0 0 28px rgba(0,229,255,.4);transition:box-shadow .2s,transform .1s;
  -webkit-tap-highlight-color:transparent;}
.btn:hover{box-shadow:0 0 55px rgba(0,229,255,.65);transform:translateY(-2px);}
.btn:active{transform:translateY(1px);}
.btn:disabled{background:#334;color:#667;box-shadow:none;cursor:default;transform:none;}

/* Category grid */
#cat-title{font-family:'Orbitron',monospace;font-size:clamp(16px,4vw,24px);
  font-weight:900;color:var(--cyan);letter-spacing:.05em;
  text-shadow:0 0 30px rgba(0,229,255,.5);margin-bottom:6px;}
#cat-hint{font-size:13px;color:var(--dim);margin-bottom:16px;}
#cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:10px;width:100%;max-width:580px;margin-bottom:20px;}
.cat-card{background:rgba(8,14,40,.75);border:1.5px solid rgba(0,229,255,.14);
  border-radius:14px;padding:14px 10px 12px;cursor:pointer;text-align:center;
  transition:border-color .18s,background .18s,box-shadow .18s;user-select:none;}
.cat-card:hover{border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.06);}
.cat-card.sel{border-color:var(--cyan);background:rgba(0,229,255,.12);
  box-shadow:0 0 18px rgba(0,229,255,.22);}
.cat-icon{font-size:30px;line-height:1;margin-bottom:6px;}
.cat-name{font-size:12px;font-weight:800;color:var(--fg);letter-spacing:.02em;}
.cat-count{font-size:10px;color:var(--dim);margin-top:3px;}

.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;}
.btn-ghost{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;
  letter-spacing:.08em;color:var(--dim);background:transparent;
  border:1.5px solid rgba(0,229,255,.2);border-radius:8px;padding:9px 20px;
  cursor:pointer;min-height:48px;transition:color .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;}
.btn-ghost:hover{color:var(--cyan);border-color:var(--cyan);}

/* Game over */
.big-score{font-family:'Orbitron',monospace;font-size:clamp(52px,14vw,78px);
  font-weight:900;color:var(--gold);text-shadow:0 0 50px rgba(255,214,0,.5);
  line-height:1;margin:8px 0 4px;}
.big-score-lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);margin-bottom:28px;}

/* Tablet */
@media(max-width:768px){
  #cat-grid{grid-template-columns:repeat(3,1fr);max-width:100%;}
  .screen{justify-content:flex-start;padding-top:max(40px,8vh);}
}
/* Mobile */
@media(max-width:480px){
  #cat-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  .cat-card{padding:12px 6px 10px;}
  .cat-icon{font-size:26px;}
  .cat-name{font-size:11px;}
  .cat-count{font-size:9px;}
  .screen{padding:16px;justify-content:flex-start;padding-top:max(36px,7vh);}
  .screen-sub{font-size:13px;margin-bottom:16px;}
  #tgt-panel{bottom:14px;padding:9px 18px 11px;min-width:160px;border-radius:13px;}
  #tgt-label{font-size:10px;}
  #tgt-value{font-size:24px;}
  #combo-flash{font-size:15px;top:56px;}
  .btn{padding:13px 34px;font-size:14px;}
  .btn-ghost{padding:11px 16px;font-size:11px;}
  #cat-title{font-size:clamp(15px,5vw,20px);}
  #cat-hint{font-size:12px;margin-bottom:12px;}
  .btn-row{gap:8px;}
}
</style>
</head>

// ── Canvas ─────────────────────────────────────────────────────────────────
var canvas = document.getElementById('canvas');
var ctx    = canvas.getContext('2d');
var gameArea = document.getElementById('game-area');
var W, H, STARS = [];

function buildStars(){
  STARS=[];
  for(var i=0;i<100;i++) STARS.push({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.4+.2,a:Math.random()*.5+.1,
    phase:Math.random()*6.28,spd:.004+Math.random()*.014,
  });
}
function resize(){
  var dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildStars();
}
window.addEventListener('resize',resize);
resize();

// ── Audio ──────────────────────────────────────────────────────────────────
var AC;
function tone(hz,type,dur,vol,delay){
  try{
    if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type=type||'sine'; o.frequency.value=hz;
    g.gain.setValueAtTime(vol||.25,t);
    g.gain.exponentialRampToValueAtTime(.001,t+(dur||.1));
    o.start(t); o.stop(t+(dur||.1));
  }catch(e){}
}
var sfx={
  shoot:  function(){tone(160,'square',.06,.12);},
  hit:    function(){tone(440,'triangle',.1,.28);tone(660,'triangle',.12,.22,.06);tone(880,'triangle',.15,.18,.12);},
  miss:   function(){tone(220,'sawtooth',.15,.22);tone(140,'sawtooth',.2,.18,.08);},
  levelup:function(){[523,659,784,1047].forEach(function(f,i){tone(f,'triangle',.15,.22,i*.075);});},
};

// ── Game state ─────────────────────────────────────────────────────────────
var MAX_LIVES=3;
var score=0,lives=MAX_LIVES,level=1,combo=0,running=false;
var target=null,tgtShowEmoji=true;
var objs=[],parts=[],floats=[];
var mx=0,my=0,spawnT=0,lastTs=0,shakeAmt=0,comboTid=null;

// ── Helpers ────────────────────────────────────────────────────────────────
function pick(excl){
  if(VOCAB.length<2) return VOCAB[0];
  var v; do{v=VOCAB[Math.floor(Math.random()*VOCAB.length)];}while(v===excl);
  return v;
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function fmt(n){return String(n).padStart(5,'0');}
function show(id){document.getElementById(id).style.display='flex';}
function hide(id){document.getElementById(id).style.display='none';}
function t(key){return TR[activeLang][key]||TR.de[key];}

// ── UI text ────────────────────────────────────────────────────────────────
function applyLang(){
  var title = t('startTitle').replace('\n','<br>');
  document.getElementById('start-title').innerHTML=title;
  document.getElementById('start-sub').innerHTML=t('startSub');
  document.getElementById('btn-play').textContent=t('play');
  if(document.getElementById('cat-title').textContent)
    document.getElementById('cat-title').textContent=t('catTitle');
  document.getElementById('cat-hint').textContent=t('catHint');
  document.getElementById('btn-all').textContent=t('selectAll');
  document.getElementById('btn-los').textContent=t('go');
  document.getElementById('go-title').innerHTML=t('gameOver').replace('\n','<br>');
  document.getElementById('go-lbl').textContent=t('points');
  document.getElementById('btn-cats').textContent=t('cats');
  document.getElementById('btn-retry').textContent=t('again');
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.lang===activeLang);
  });
}

// ── Category screen ────────────────────────────────────────────────────────
function buildCatGrid(){
  document.getElementById('cat-title').textContent=t('catTitle');
  document.getElementById('cat-hint').textContent=t('catHint');
  document.getElementById('btn-all').textContent=t('selectAll');
  document.getElementById('btn-los').textContent=t('go');
  var grid=document.getElementById('cat-grid');
  grid.innerHTML='';
  CATEGORIES.forEach(function(cat){
    var card=document.createElement('div');
    card.className='cat-card'+(selectedCats[cat.id]?' sel':'');
    card.dataset.id=cat.id;
    card.innerHTML='<div class="cat-icon">'+cat.icon+'</div>'+
      '<div class="cat-name">'+cat.names[activeLang]+'</div>'+
      '<div class="cat-count">'+cat.words.length+' '+t('words')+'</div>';
    card.addEventListener('click',function(){toggleCat(cat.id);});
    grid.appendChild(card);
  });
  updateLosBtn();
}
function toggleCat(id){
  selectedCats[id]=!selectedCats[id];
  var card=document.querySelector('.cat-card[data-id="'+id+'"]');
  if(card) card.classList.toggle('sel',!!selectedCats[id]);
  updateLosBtn();
}
function selectAll(){
  var anyOff=CATEGORIES.some(function(c){return !selectedCats[c.id];});
  CATEGORIES.forEach(function(c){selectedCats[c.id]=anyOff;});
  document.querySelectorAll('.cat-card').forEach(function(card){
    card.classList.toggle('sel',!!selectedCats[card.dataset.id]);
  });
  updateLosBtn();
}
function updateLosBtn(){
  var n=CATEGORIES.filter(function(c){return selectedCats[c.id];}).length;
  document.getElementById('btn-los').disabled=(n===0);
}
function buildVocab(){
  VOCAB=[];
  CATEGORIES.forEach(function(cat){
    if(selectedCats[cat.id]) cat.words.forEach(function(w){VOCAB.push(w);});
  });
}

// ── Game logic ─────────────────────────────────────────────────────────────
function nextTarget(){
  target=pick(target);
  tgtShowEmoji=Math.random()>.5;
  objs=[]; spawnT=9999;
  var lbl=document.getElementById('tgt-label');
  var val=document.getElementById('tgt-value');
  if(tgtShowEmoji){
    lbl.textContent=t('shootWord');
    val.style.fontSize='44px';
    val.textContent=target.em;
  } else {
    lbl.textContent=t('shootPic');
    val.style.fontSize='22px';
    val.textContent=target[activeLang];
  }
}
function spawn(){
  if(!target||!running) return;
  var fromL=Math.random()>.5;
  var baseSpd=(1.7+level*.32+Math.random()*.9)*(fromL?1:-1);
  var showEm=!tgtShowEmoji;
  var batch=[{item:target,ok:true}];
  var nd=Math.min(VOCAB.length-1,Math.floor(Math.random()*2)+1);
  for(var i=0;i<nd;i++) batch.push({item:pick(target),ok:false});
  batch.forEach(function(b,i){
    objs.push({
      x:fromL?-90-i*25:W+90+i*25, y:90+Math.random()*(H-200),
      vx:baseSpd*(.9+Math.random()*.2), vy:(Math.random()-.5)*.8,
      item:b.item,ok:b.ok,showEm:showEm,
      sc:.25,rot:(Math.random()-.5)*.35,rotV:(Math.random()-.5)*.006,
      wb:Math.random()*6.28,wbV:.025+Math.random()*.018,alive:true,
    });
  });
}
function burst(x,y,good){
  var n=good?22:10,hue=good?185:0;
  for(var i=0;i<n;i++){
    var a=Math.PI*2*i/n+Math.random()*.5,s=3+Math.random()*5;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,
      r:3+Math.random()*3,life:1,decay:.022+Math.random()*.013,hue:hue});
  }
}
function floatMsg(x,y,txt,good){
  floats.push({x:x,y:y-10,vy:-1.7,txt:txt,good:good,life:1});
}
function updateHUD(){
  document.getElementById('score-disp').textContent=fmt(score);
  document.getElementById('level-disp').textContent=t('level')+' '+level;
  var ld=document.getElementById('lives-disp'); ld.innerHTML='';
  for(var i=0;i<MAX_LIVES;i++){
    var d=document.createElement('div');
    d.className='life'+(i>=lives?' dead':'');
    ld.appendChild(d);
  }
}
var isTouch=('ontouchstart' in window);
function shoot(x,y){
  if(!running) return;
  sfx.shoot();
  var hitR=isTouch?68:52, HIT2=hitR*hitR;
  for(var i=0;i<objs.length;i++){
    var o=objs[i]; if(!o.alive) continue;
    var dx=o.x-x,dy=o.y-y;
    if(dx*dx+dy*dy<HIT2){
      o.alive=false; burst(o.x,o.y,o.ok);
      if(o.ok){
        combo++;
        var pts=10+(combo>2?(combo-2)*5:0);
        score+=pts; sfx.hit();
        floatMsg(o.x,o.y,'+'+pts,true);
        if(combo>1) showCombo(combo);
        var nl=(score/80|0)+1;
        if(nl>level){level=nl;sfx.levelup();}
        nextTarget();
      } else {
        combo=0; lives--; sfx.miss();
        floatMsg(o.x,o.y,t('wrong'),false);
        shakeAmt=14;
        if(lives<=0){
          running=false; gameArea.style.display='none';
          setTimeout(function(){
            document.getElementById('final-val').textContent=fmt(score);
            show('gameover-screen');
          },700);
        }
      }
      updateHUD(); return;
    }
  }
}
function showCombo(n){
  var keys=['','','','combo3','combo4','combo5','combo6'];
  var el=document.getElementById('combo-flash');
  el.textContent=n<keys.length?t(keys[n]):('×'+n+' COMBO! 🔥');
  el.style.opacity='1';
  clearTimeout(comboTid);
  comboTid=setTimeout(function(){el.style.opacity='0';},950);
}

// ── Drawing ────────────────────────────────────────────────────────────────
function drawCrosshair(x,y){
  var r=20,g=7,L=13;
  ctx.save();
  ctx.strokeStyle='#ff4060';ctx.lineWidth=1.8;ctx.globalAlpha=.9;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-r-g-L,y);ctx.lineTo(x-r-g,y);
  ctx.moveTo(x+r+g,y);ctx.lineTo(x+r+g+L,y);
  ctx.moveTo(x,y-r-g-L);ctx.lineTo(x,y-r-g);
  ctx.moveTo(x,y+r+g);ctx.lineTo(x,y+r+g+L);
  ctx.stroke();
  ctx.fillStyle='#ff4060';ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawObj(o){
  ctx.save();
  ctx.translate(o.x,o.y+Math.sin(o.wb)*3);
  ctx.rotate(o.rot);ctx.scale(o.sc,o.sc);
  if(o.showEm){
    ctx.font='40px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(o.item.em,0,0);
  } else {
    var txt=o.item[activeLang];
    ctx.font='bold 16px Nunito,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    var tw=ctx.measureText(txt).width,pw=tw+22,ph=30;
    rrect(-pw/2,-ph/2,pw,ph,8);
    ctx.fillStyle='rgba(9,16,44,.92)';ctx.fill();
    ctx.strokeStyle='rgba(0,229,255,.38)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#dce8ff';ctx.fillText(txt,0,1);
  }
  ctx.restore();
}

// ── Main loop ──────────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min(ts-lastTs,50);lastTs=ts;
  var sx=0,sy=0;
  if(shakeAmt>.5){shakeAmt*=.75;sx=(Math.random()-.5)*shakeAmt*2;sy=(Math.random()-.5)*shakeAmt*2;}
  ctx.save();ctx.translate(sx,sy);
  ctx.fillStyle='#060917';ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle='rgba(0,229,255,.03)';ctx.lineWidth=1;
  for(var xi=0;xi<W;xi+=70){ctx.beginPath();ctx.moveTo(xi,0);ctx.lineTo(xi,H);ctx.stroke();}
  for(var yi=0;yi<H;yi+=70){ctx.beginPath();ctx.moveTo(0,yi);ctx.lineTo(W,yi);ctx.stroke();}
  for(var si=0;si<STARS.length;si++){
    var s=STARS[si],a=s.a+Math.sin(ts*s.spd+s.phase)*.18;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(180,210,255,'+a+')';ctx.fill();
  }
  if(running){
    spawnT+=dt;
    var si2=Math.max(450,1650-level*85);
    if(spawnT>si2){spawnT=0;spawn();}
    for(var oi=objs.length-1;oi>=0;oi--){
      var o=objs[oi];
      if(!o.alive){objs.splice(oi,1);continue;}
      o.x+=o.vx*dt/16;o.y+=o.vy*dt/16;o.rot+=o.rotV;o.wb+=o.wbV;
      o.sc=Math.min(1,o.sc+.11);
      if(o.x<-140||o.x>W+140){objs.splice(oi,1);continue;}
      drawObj(o);
    }
  }
  for(var pi=parts.length-1;pi>=0;pi--){
    var p=parts[pi];
    p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=.14*dt/16;
    p.life-=p.decay*dt/16;
    if(p.life<=0){parts.splice(pi,1);continue;}
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle='hsla('+p.hue+',100%,65%,'+p.life+')';ctx.fill();
  }
  for(var fi=floats.length-1;fi>=0;fi--){
    var f=floats[fi];
    f.y+=f.vy*dt/16;f.life-=.02*dt/16;
    if(f.life<=0){floats.splice(fi,1);continue;}
    ctx.save();ctx.globalAlpha=f.life;
    ctx.font='bold 18px Orbitron,sans-serif';ctx.textAlign='center';
    ctx.fillStyle=f.good?'#ffd600':'#ff4060';
    ctx.fillText(f.txt,f.x,f.y);
    ctx.restore();
  }
  if(running&&!isTouch) drawCrosshair(mx,my);
  ctx.restore();
}

// ── Flow ───────────────────────────────────────────────────────────────────
function goToCategories(){
  hide('start-screen');hide('gameover-screen');
  buildCatGrid(); show('cat-screen');
}
function startGame(){
  buildVocab();
  if(VOCAB.length<4) return;
  score=0;lives=MAX_LIVES;level=1;combo=0;running=true;
  objs=[];parts=[];floats=[];spawnT=0;
  hide('cat-screen');hide('gameover-screen');
  gameArea.style.display='block';
  nextTarget();updateHUD();
}

// ── Input ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    activeLang=this.dataset.lang;
    applyLang();
  });
});
gameArea.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
gameArea.addEventListener('click',function(e){shoot(e.clientX,e.clientY);});
gameArea.addEventListener('touchmove',function(e){
  e.preventDefault();mx=e.touches[0].clientX;my=e.touches[0].clientY;
},{passive:false});
gameArea.addEventListener('touchend',function(e){
  e.preventDefault();var t=e.changedTouches[0];mx=t.clientX;my=t.clientY;shoot(t.clientX,t.clientY);
},{passive:false});
document.getElementById('btn-play').addEventListener('click',goToCategories);
document.getElementById('btn-all').addEventListener('click',selectAll);
document.getElementById('btn-los').addEventListener('click',startGame);
document.getElementById('btn-retry').addEventListener('click',startGame);
document.getElementById('btn-cats').addEventListener('click',goToCategories);

// ── Init ───────────────────────────────────────────────────────────────────
applyLang();
lastTs=performance.now();
requestAnimationFrame(loop);
</script>
</body>
